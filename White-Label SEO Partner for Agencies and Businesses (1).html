body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}

h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;line-height:1.12;margin:0 0 12px}

details{border-bottom:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:600}details p{margin:10px 0 0;color:var(--mut)}
label{display:block;font-weight:600;font-size:.9rem;margin-top:14px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--mut);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}form{max-width:620px}

svg{width:100%;height:auto}.n{fill:var(--card);stroke:var(--fg);stroke-width:2}.n.m{fill:var(--acc);stroke:var(--acc)}text{fill:var(--fg);font:600 15px system-ui;text-anchor:middle}.m+text{fill:var(--on)}.ln{stroke:var(--acc);stroke-width:3;stroke-dasharray:6 8;animation:d 1.1s linear infinite}@keyframes d{to{stroke-dashoffset:-14}}

"white-label-seo":["White-Label SEO","White-label SEO your clients see as yours","Reliable SEO fulfillment delivered under your agency’s brand, so you can add capacity without hiring ahead of demand.",["Technical audits|Crawl, indexation and site-health reviews formatted for your client reports.","Content and on-page|Briefs, optimization and publishing support in your agency’s voice.","Link building|Outreach and digital PR planned around each client’s niche.","Reporting|Reports you can present under your own brand."],"What does a partnership look like?","Scope, deliverables, tools and communication are agreed up front, then delivered on a set cadence with review checkpoints. Confidentiality terms are written into your agreement.","a"],
"seo-for-agencies":["SEO for Agencies","Add SEO capacity without adding headcount","A delivery partner for web, design and PPC agencies that want to sell SEO without building a full in-house team.",["Capacity on demand|Scale up for new clients and down between projects.","Scoped onboarding|Agree tools, deliverables and communication before work begins.","One point of contact|A single contact for your account team."],"Who owns the client relationship?","You do. Your agency leads the relationship; we join calls only if you want us to.","a"],
"geo-ai-search":["AI Search (GEO)","Be the answer when people ask AI","Generative engine optimization (GEO) helps your brand get understood, cited and recommended in AI-driven search, alongside traditional SEO.",["AI visibility audit|Review how your brand appears for the prompts and queries that matter.","Clear brand facts|Make key information consistent, structured and easy to cite.","Answer-ready content|Pages with direct answers, sources and clean structure.","Ongoing testing|Track mentions and citations over time; AI answers vary by user."],"Can you guarantee AI citations?","No. AI answers vary and change often. We focus on clarity, structure and measured testing.","c"],
'seo-audit':['SEO Audit','Know exactly what is holding your site back','A structured review of technical health, content, links and competitors that ends in a prioritized action plan.',['Technical review|Crawl, indexation, speed, mobile and structured data.','Content review|Search intent match, thin or duplicate pages and content gaps.','Backlink review|Link quality, risks and opportunities.','Action plan|Fixes ranked by impact and effort.'],'How long does an audit take?','Small sites can take days and large sites longer. The timeline is agreed when the audit is scoped.','c'],
'off-page-seo':['Off-Page SEO','Build authority beyond your own website','Earn the links, mentions and reviews that signal your brand can be trusted.',['Link earning|Relevant, editorial placements.','Brand mentions|Citations and unlinked mentions turned into links.','Digital PR|Data, expert comments and stories worth covering.','Reputation signals|Reviews and consistent brand profiles.'],'Is off-page SEO just link building?','No. Links matter most, but mentions, reviews, citations and brand searches also signal trust.','c'],
'gmb-optimization':['Google Business Profile','Turn your Google Business Profile into a lead source','Complete, accurate and active profiles earn more calls, direction requests and website visits.',['Profile setup|Categories, services, hours and attributes.','Photos and posts|Genuine, regular updates.','Review management|Request reviews and reply to them.','Performance tracking|Calls, directions and website clicks.'],'Can a business without a shop have a profile?','Service-area businesses can qualify if they meet Google’s guidelines.','c'],
'mobile-seo':['Mobile SEO','Win on the screen most people search on','Make sure the mobile version of your site is fast, complete and easy to use, because search engines index it first.',['Mobile-first check|Content, links and metadata match across devices.','Speed and Core Web Vitals|Fix heavy images, scripts and layout shifts.','Tap-friendly design|Readable text, clear buttons and simple forms.','Click-to-call and maps|Quick contact paths for on-the-go searchers.'],'Do I need a separate mobile site?','No. A responsive site that serves the same content on every device is the simplest approach.','c'],
'enterprise-seo':['Enterprise SEO','SEO that scales across large sites and many teams','Governance, architecture and reporting for sites with thousands of pages and multiple stakeholders.',['Governance|Templates, standards and release checks.','Crawl and architecture|Manage large URL sets and internal linking.','Team coordination|Align development, content, product and legal.','Segmented reporting|Results by market, product line or business unit.'],'How is enterprise SEO different?','Scale, process and coordination matter as much as tactics: more stakeholders, more templates and more risk.','c'],
'small-business-seo':['Small Business SEO','Practical SEO for small budgets and busy owners','Focus on the few pages and searches that bring customers, and build from there.',['Focused priorities|Start closest to revenue.','Local foundations|Profile, citations and reviews.','Simple content plan|A few strong pages beat many weak ones.','Plain-English reports|Know what was done and why.'],'What can a small budget achieve?','A focused plan on the right pages can move the needle, though competitive markets take longer.','c'],
'conversion-optimization':['Conversion Optimization','Turn more organic visitors into leads and sales','Traffic only pays off when visitors act. Improve pages, forms and offers using data.',['Funnel analysis|Find where visitors drop off.','Landing page improvements|Clearer offers, forms and trust signals.','A/B testing|Test headlines and calls to action when traffic allows.','Tracking setup|Events, goals and attribution you can trust.'],'Do I need a lot of traffic to test?','Meaningful A/B tests need enough visitors. With lower traffic, start with research-led improvements.','c'],
'seo-consultation':['SEO Consultation','Expert guidance without a long contract','A focused session to review your goals, your current SEO and the next best moves.',['Strategy session|Goals, constraints and quick wins.','Plan review|A second opinion on in-house or agency work.','Team guidance|Help your team learn the essentials.','Roadmap|A prioritized list of next steps.'],'Is a consultation enough on its own?','It suits teams that can implement themselves. Others combine it with hands-on delivery.','c'],
"free-seo-tools":["Free SEO Tools","Free SEO tools that run in your browser","Generate a robots.txt file or FAQ schema markup. Everything runs locally and nothing you type is uploaded.",[],"Is my input stored?","No. These tools run in your browser and do not send your input anywhere.",""],
"seo-services":["SEO Services","SEO built around your revenue goals","Strategic search engine optimization for businesses that want qualified organic traffic, not vanity metrics.",["Audit and strategy|A prioritized roadmap based on your market and site.","Execution|Technical, content and authority work delivered in stages.","Measurement|Reporting tied to leads, sales and visibility."],"How long does SEO take?","It varies with competition, site health and budget. Programs are usually judged over months, not weeks.","c"],
"technical-seo":["Technical SEO","A site search engines can crawl, render and trust","Find and fix the issues that stop good pages from being discovered or ranking.",["Crawl and indexation|Resolve blocked, duplicate and orphaned pages.","Core Web Vitals|Diagnose speed and layout-stability problems.","Structured data|Schema that matches visible page content.","Migrations|Redirect plans and post-launch checks."],"Do you implement fixes or only report them?","Either: developer-ready tickets or hands-on implementation, depending on access and scope.","c"],
"on-page-seo":["On-Page SEO","Pages that match what searchers actually want","Align every important page with one clear search intent and one clear next step.",["Keyword mapping|One primary intent per page.","Titles and metadata|Written to earn the click.","Content structure|Headings, internal links and media that support the topic.","Conversion checks|Calls to action that fit the page’s purpose."],"Do you rewrite existing pages?","We start with pages that show the clearest opportunity, then recommend edits or rewrite them depending on scope.","c"],
"seo-content":["SEO Content","Content that earns traffic and supports sales","Research-led articles, guides and landing pages written for people first and search second.",["Topic research|The questions your buyers actually search.","Briefs and drafts|Structured around intent and subject accuracy.","Editorial review|Fact checks and brand-voice edits.","Refreshes|Update older pages that have slipped."],"Do you use AI to write content?","Tool use is agreed per engagement, and all content should be reviewed by a human editor before publishing.","c"],
"link-building":["Link Building","Links earned through relevance, not shortcuts","Build authority with editorial placements that make sense for your audience.",["Link profile review|Understand current strengths and risks.","Digital PR|Data- and story-led outreach.","Manual outreach|Prospecting relevant publications and partners.","Cleanup|Address harmful links only where needed."],"Do you buy links?","Our recommended approach avoids paid-link schemes because they risk penalties. Campaigns focus on editorial, relevant placements.","c"],
